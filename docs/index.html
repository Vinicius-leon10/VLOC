<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VLOC Hotel">
  <meta name="theme-color" content="#163a72">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <title>VLOC Hotel</title>
  <style>
    :root {
      --azul: #1d6fa3;
      --azul-escuro: #144f76;
      --verde: #4caf2a;
      --verde-escuro: #2f7d17;
      --papel: #eceae2;
      --borda: #1a1a24;
      --texto: #1f2230;
      --barra: linear-gradient(rgba(36, 83, 154, .95), rgba(22, 58, 114, .95));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #0e1424; color: #fff;
      font-family: "Ubuntu", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    canvas#tela { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: none; }
    input { font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; }
    button { font: inherit; cursor: pointer; }

    /* ---------- Janela de entrada ---------- */
    #login {
      position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 16px;
      background: rgba(12, 16, 30, .35);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .janela {
      width: min(400px, 100%); background: #f3f2ee; color: var(--texto);
      border: 3px solid #12284f; border-radius: 18px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .25), 0 18px 50px rgba(0, 0, 0, .5);
    }
    .janela-titulo {
      position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; color: #fff; font-size: 26px; text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
      background: linear-gradient(#24539a, #163a72); border-bottom: 3px solid #12284f;
    }
    .janela-titulo::after {
      content: ""; position: absolute; top: 0; right: -10px; width: 120px; height: 100%;
      background: repeating-linear-gradient(115deg, transparent 0 18px, rgba(255, 255, 255, .10) 18px 30px);
    }
    .janela-titulo .logo { font-size: 34px; padding-right: 14px; border-right: 2px solid rgba(255, 255, 255, .3); text-shadow: none; }
    .janela-titulo b { font-weight: 700; }
    .janela-corpo { padding: 16px; display: grid; gap: 12px; }
    .topo { display: flex; gap: 14px; align-items: center; }
    .palco {
      flex: none; width: 112px; height: 136px; border-radius: 14px; border: 3px solid #1d2b4a;
      background:
        repeating-conic-gradient(from 0deg at 50% -10%, rgba(255, 255, 255, .13) 0 8deg, transparent 8deg 18deg),
        linear-gradient(#5aa8ec, #a8d4f8 64%, #d6dbe5 64%, #c3c9d6);
    }
    .campos { display: grid; gap: 10px; flex: 1; min-width: 0; }
    .com-icone { position: relative; }
    .com-icone svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: #2c3550; }
    .campo {
      width: 100%; height: 52px; padding: 0 12px 0 44px; border: 2px solid #cfd0d6; border-radius: 12px;
      background: #fff; color: var(--texto); outline: none; font-size: 18px;
    }
    .campo:focus { border-color: #2f8fe0; }
    .dica { font-size: 13px; color: #6b6c72; }
    .rotulo { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: #2c3550; text-transform: uppercase; margin-bottom: 7px; }
    .rotulo svg { width: 20px; height: 20px; fill: #2c3550; }
    .amostras { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
    .amostra {
      position: relative; aspect-ratio: 1; border-radius: 9px; border: 2px solid rgba(0, 0, 0, .55); padding: 0;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18), inset 0 3px 0 rgba(255, 255, 255, .35);
    }
    .amostra[aria-pressed="true"] { outline: 3px solid #2f8fe0; outline-offset: 2px; }
    .amostra[aria-pressed="true"]::after {
      content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; font-size: 18px; font-weight: 700; text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    }
    .amostra.clara[aria-pressed="true"]::after { color: #1f2230; text-shadow: none; }
    .botao-verde {
      margin-top: 4px; height: 60px; display: flex; align-items: center; justify-content: center; gap: 16px;
      border: 3px solid #1f5e12; border-radius: 14px; color: #fff; font-size: 21px; font-weight: 700;
      background: linear-gradient(#72d64a, #4cb52a 55%, #3a9a1e);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), inset 0 3px 0 rgba(255, 255, 255, .35), 0 3px 0 rgba(0, 0, 0, .25);
      text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
    }
    .botao-verde svg { width: 30px; height: 30px; fill: #fff; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .3)); }
    .botao-verde .sep { width: 2px; height: 30px; background: rgba(255, 255, 255, .35); }
    .botao-verde:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18); }

    /* ---------- Dentro da sala ---------- */
    #online {
      position: fixed; z-index: 1; top: calc(8px + env(safe-area-inset-top)); left: 8px;
      max-width: calc(100vw - 16px); display: none; align-items: center; gap: 8px;
      background: var(--barra); border: 2px solid #12284f; border-radius: 12px; padding: 7px 12px; font-size: 13px;
    }
    #online b { color: #7ee35a; }
    #online-nomes { color: #b8c0d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #chat {
      position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; display: none; gap: 8px; align-items: center;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--barra); border-top: 3px solid #12284f;
    }
    #chat .dentro { display: flex; gap: 8px; width: min(560px, 100%); margin: 0 auto; }
    #msg {
      flex: 1; min-width: 0; padding: 10px 14px; border-radius: 22px; border: 2px solid #12284f;
      background: #fff; color: var(--texto); outline: none;
    }
    .acao {
      flex: none; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #12284f; font-size: 20px;
      background: linear-gradient(#72d64a, #4cb52a 55%, #3a9a1e); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .35);
    }
    .acao:active { transform: translateY(1px); }
    #status {
      position: fixed; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none;
      background: var(--barra); border: 2px solid #12284f; padding: 10px 16px; border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm" class="janela">
      <div class="janela-titulo"><span class="logo">🏨</span><span><b>VLOC</b> Hotel</span></div>
      <div class="janela-corpo">
        <div class="topo">
          <canvas id="previa" class="palco"></canvas>
          <div class="campos">
            <div class="com-icone">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 21c0-5 4-8 9-8s9 3 9 8z"/></svg>
              <input id="nome" class="campo" placeholder="Seu nome" maxlength="16" required autocomplete="nickname">
            </div>
            <div class="com-icone">
              <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.5A1.5 1.5 0 0 1 20 11.5v9A1.5 1.5 0 0 1 18.5 22h-13A1.5 1.5 0 0 1 4 20.5v-9A1.5 1.5 0 0 1 5.5 10zm2.5 0h5V7a2.5 2.5 0 0 0-5 0zM12 14a1.8 1.8 0 0 0-1 3.3V19h2v-1.7a1.8 1.8 0 0 0-1-3.3z"/></svg>
              <input id="senha" class="campo" type="password" placeholder="Senha da sala" required>
            </div>
          </div>
        </div>
        <div class="dica">Quem usar a mesma senha entra na mesma sala.</div>
        <div>
          <div class="rotulo"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6 2 11c0 4.4 3.6 8 8 8h1.5a1.5 1.5 0 0 0 1.1-2.5 1.5 1.5 0 0 1 1.1-2.5H16c3.3 0 6-2.7 6-6C22 4.9 17.5 2 12 2zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>Camiseta</div>
          <div class="amostras" data-alvo="cor"></div>
        </div>
        <div>
          <div class="rotulo"><svg viewBox="0 0 24 24"><path d="M12 2C7 2 4 5.5 4 10c0 3 1 5 1 8h3c0-2-.5-3.5-.5-5.5C7.5 9 9.5 7 12 7s4.5 2 4.5 5.5c0 2-.5 3.5-.5 5.5h3c0-3 1-5 1-8 0-4.5-3-8-8-8z"/></svg>Cabelo</div>
          <div class="amostras" data-alvo="cabelo"></div>
        </div>
        <input type="hidden" id="cor" value="#d3283c">
        <input type="hidden" id="cabelo" value="#3a2216">
        <button class="botao-verde"><svg viewBox="0 0 24 24"><path d="M13 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6v-2.5h5.5v-13H13zM9.5 7.5l5 4.5-5 4.5V13.5H3v-3h6.5z"/></svg><span class="sep"></span>Entrar no hotel</button>
      </div>
    </form>
  </div>
  <div id="online">🏨 <span><b id="online-n">0</b> online</span> <span id="online-nomes"></span></div>
  <div id="status"></div>
  <form id="chat">
    <div class="dentro">
      <input id="msg" placeholder="Fale algo..." enterkeyhint="send" maxlength="120" autocomplete="off">
      <button type="button" class="acao" data-acao="acenar" aria-label="Acenar">👋</button>
      <button type="button" class="acao" data-acao="dancar" aria-label="Dançar">💃</button>
    </div>
  </form>
  <canvas id="tela"></canvas>
  <script>
    // Mostra qualquer erro na tela para facilitar o suporte pelo celular.
    function mostrarErro(msg) {
      const el = document.getElementById('status');
      el.style.display = 'block';
      el.style.color = '#ff8a8a';
      el.textContent = 'Erro: ' + msg;
    }
    addEventListener('error', (e) => mostrarErro(e.message || (e.target && e.target.src) || 'desconhecido'), true);
    addEventListener('unhandledrejection', (e) => mostrarErro(e.reason && e.reason.message || String(e.reason)));

    // Amostras de cor, como no editor de visual do Habbo.
    const PALETAS = {
      cor: ['#d3283c', '#f47b20', '#f6c72f', '#1f9a3c', '#2f6fd6', '#7b3fd0', '#f45fb0', '#252a3a', '#f4f4f6'],
      cabelo: ['#3a2216', '#7a4a26', '#a8692e', '#e0a43a', '#f3dc96', '#c2412b', '#1d1d24', '#8f8f99', '#e84fa8'],
    };
    for (const grupo of document.querySelectorAll('.amostras')) {
      const alvo = document.getElementById(grupo.dataset.alvo);
      for (const cor of PALETAS[grupo.dataset.alvo]) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'amostra';
        b.style.background = cor;
        b.dataset.cor = cor;
        b.setAttribute('aria-label', cor);
        const n = parseInt(cor.slice(1), 16);
        if ((n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11 > 190) b.classList.add('clara');
        b.addEventListener('click', () => {
          alvo.value = cor;
          grupo.querySelectorAll('.amostra').forEach((x) => x.setAttribute('aria-pressed', x === b));
        });
        grupo.appendChild(b);
      }
    }
    function marcarAmostras() {
      for (const grupo of document.querySelectorAll('.amostras')) {
        const valor = document.getElementById(grupo.dataset.alvo).value;
        grupo.querySelectorAll('.amostra').forEach((x) => x.setAttribute('aria-pressed', x.dataset.cor === valor));
      }
    }
  </script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js" onerror="mostrarErro('não carregou a biblioteca MQTT')"></script>
  <script src="rede.js"></script>
  <script src="arte.js"></script>
  <script src="desenho.js"></script>
  <script src="game.js"></script>
  <script>marcarAmostras();</script>
</body>
</html>
