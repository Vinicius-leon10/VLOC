<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VLOC Hotel">
  <meta name="theme-color" content="#0e1424">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <title>VLOC Hotel</title>
  <style>
    :root {
      --azul: #1d6fa3;
      --azul-escuro: #144f76;
      --verde: #4caf2a;
      --verde-escuro: #2f7d17;
      --papel: #eceae2;
      --borda: #1a1a24;
      --texto: #1f2230;
      --barra: rgba(14, 18, 32, .92);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #0e1424; color: #fff;
      font-family: "Ubuntu", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    canvas#tela { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: none; }
    input { font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; }
    button { font: inherit; cursor: pointer; }

    /* ---------- Janela de entrada no estilo Habbo ---------- */
    #login {
      position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(ellipse at 50% 30%, rgba(40, 120, 190, .55), rgba(8, 12, 24, .85));
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    }
    .janela {
      width: min(360px, 100%); background: var(--papel); color: var(--texto);
      border: 2px solid var(--borda); border-radius: 10px; overflow: hidden;
      box-shadow: 0 10px 0 rgba(0, 0, 0, .25), 0 20px 40px rgba(0, 0, 0, .45);
    }
    .janela-titulo {
      background: linear-gradient(var(--azul), var(--azul-escuro)); color: #fff;
      padding: 10px 14px; font-weight: 700; font-size: 16px; text-shadow: 0 1px 0 rgba(0, 0, 0, .4);
      border-bottom: 2px solid var(--borda); display: flex; align-items: center; gap: 8px;
    }
    .janela-corpo { padding: 14px; display: grid; gap: 10px; }
    .topo { display: flex; gap: 12px; align-items: center; }
    .palco {
      flex: none; width: 84px; height: 104px; border-radius: 8px; border: 2px solid var(--borda);
      background: linear-gradient(#bfe6ff 0 62%, #d7b98a 62%);
    }
    .campos { display: grid; gap: 8px; flex: 1; min-width: 0; }
    .campo {
      width: 100%; padding: 9px 10px; border: 2px solid #b9b5a6; border-radius: 6px;
      background: #fff; color: var(--texto); outline: none;
    }
    .campo:focus { border-color: var(--azul); }
    .dica { font-size: 12px; color: #6b6a62; margin-top: -4px; }
    .rotulo { font-size: 12px; font-weight: 700; color: #4a4a44; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
    .amostras { display: flex; flex-wrap: wrap; gap: 6px; }
    .amostra {
      width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--borda); padding: 0;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
    }
    .amostra[aria-pressed="true"] { outline: 3px solid var(--azul); outline-offset: 1px; }
    .botao-verde {
      margin-top: 4px; padding: 12px; border: 2px solid var(--borda); border-radius: 8px; color: #fff;
      background: linear-gradient(#6fd043, var(--verde) 55%, var(--verde-escuro));
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .2), inset 0 2px 0 rgba(255, 255, 255, .35);
      font-size: 17px; font-weight: 700; text-shadow: 0 1px 0 rgba(0, 0, 0, .45);
    }
    .botao-verde:active { transform: translateY(1px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .2); }

    /* ---------- Dentro da sala ---------- */
    #online {
      position: fixed; z-index: 1; top: calc(8px + env(safe-area-inset-top)); left: 8px;
      max-width: calc(100vw - 16px); display: none; align-items: center; gap: 8px;
      background: var(--barra); border: 2px solid #000; border-radius: 10px; padding: 6px 10px; font-size: 13px;
    }
    #online b { color: #7ee35a; }
    #online-nomes { color: #b8c0d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #chat {
      position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; display: none; gap: 8px; align-items: center;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--barra); border-top: 2px solid #000;
    }
    #chat .dentro { display: flex; gap: 8px; width: min(560px, 100%); margin: 0 auto; }
    #msg {
      flex: 1; min-width: 0; padding: 10px 14px; border-radius: 20px; border: 2px solid #000;
      background: #fff; color: var(--texto); outline: none;
    }
    .acao {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #000; font-size: 20px;
      background: linear-gradient(#3a4466, #252c45); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .15);
    }
    .acao:active { transform: translateY(1px); }
    #status {
      position: fixed; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none;
      background: var(--barra); border: 2px solid #000; padding: 10px 16px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm" class="janela">
      <div class="janela-titulo">🏨 VLOC Hotel</div>
      <div class="janela-corpo">
        <div class="topo">
          <canvas id="previa" class="palco"></canvas>
          <div class="campos">
            <input id="nome" class="campo" placeholder="Seu nome" maxlength="16" required autocomplete="nickname">
            <input id="senha" class="campo" type="password" placeholder="Senha da sala" required>
          </div>
        </div>
        <div class="dica">Quem usar a mesma senha entra na mesma sala.</div>
        <div>
          <div class="rotulo">Camiseta</div>
          <div class="amostras" data-alvo="cor"></div>
        </div>
        <div>
          <div class="rotulo">Cabelo</div>
          <div class="amostras" data-alvo="cabelo"></div>
        </div>
        <input type="hidden" id="cor" value="#e94560">
        <input type="hidden" id="cabelo" value="#4a2f1d">
        <button class="botao-verde">Entrar no hotel</button>
      </div>
    </form>
  </div>
  <div id="online">🏨 <span><b id="online-n">0</b> online</span> <span id="online-nomes"></span></div>
  <div id="status"></div>
  <form id="chat">
    <div class="dentro">
      <input id="msg" placeholder="Fale algo..." enterkeyhint="send" maxlength="120" autocomplete="off">
      <button type="button" class="acao" data-acao="acenar" aria-label="Acenar">👋</button>
      <button type="button" class="acao" data-acao="dancar" aria-label="Dançar">💃</button>
    </div>
  </form>
  <canvas id="tela"></canvas>
  <script>
    // Mostra qualquer erro na tela para facilitar o suporte pelo celular.
    function mostrarErro(msg) {
      const el = document.getElementById('status');
      el.style.display = 'block';
      el.style.color = '#ff8a8a';
      el.textContent = 'Erro: ' + msg;
    }
    addEventListener('error', (e) => mostrarErro(e.message || (e.target && e.target.src) || 'desconhecido'), true);
    addEventListener('unhandledrejection', (e) => mostrarErro(e.reason && e.reason.message || String(e.reason)));

    // Amostras de cor, como no editor de visual do Habbo.
    const PALETAS = {
      cor: ['#e94560', '#ff8c42', '#f2c14e', '#2fa36b', '#3a7bd5', '#7b5cd6', '#ff6fb5', '#2b2d42', '#f4f4f8'],
      cabelo: ['#2b1d14', '#4a2f1d', '#8a5a2b', '#d9a441', '#f3d98b', '#b33a2b', '#1f1f28', '#8e8e9e', '#e86ab0'],
    };
    for (const grupo of document.querySelectorAll('.amostras')) {
      const alvo = document.getElementById(grupo.dataset.alvo);
      for (const cor of PALETAS[grupo.dataset.alvo]) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'amostra';
        b.style.background = cor;
        b.dataset.cor = cor;
        b.setAttribute('aria-label', cor);
        b.addEventListener('click', () => {
          alvo.value = cor;
          grupo.querySelectorAll('.amostra').forEach((x) => x.setAttribute('aria-pressed', x === b));
        });
        grupo.appendChild(b);
      }
    }
    function marcarAmostras() {
      for (const grupo of document.querySelectorAll('.amostras')) {
        const valor = document.getElementById(grupo.dataset.alvo).value;
        grupo.querySelectorAll('.amostra').forEach((x) => x.setAttribute('aria-pressed', x.dataset.cor === valor));
      }
    }
  </script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js" onerror="mostrarErro('não carregou a biblioteca MQTT')"></script>
  <script src="rede.js"></script>
  <script src="desenho.js"></script>
  <script src="game.js"></script>
  <script>marcarAmostras();</script>
</body>
</html>
