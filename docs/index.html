<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VLOC Hotel">
  <meta name="theme-color" content="#1b1d2a">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>VLOC Hotel</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; background: #1b1d2a; font-family: system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: none; }
    #login { position: fixed; inset: 0; display: grid; place-items: center; background: #1b1d2a; z-index: 2; }
    #login form { background: #2a2d40; padding: 28px; border-radius: 12px; width: min(320px, calc(100vw - 32px)); display: grid; gap: 12px; }
    #login h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
    input, button { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid #444866; background: #1b1d2a; color: #fff; }
    input { -webkit-user-select: text; user-select: text; }
    input[type=color] { padding: 2px; height: 42px; width: 100%; }
    button { background: #e94560; border: none; font-weight: 600; cursor: pointer; }
    #chat { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(480px, calc(100vw - 32px)); display: none; }
    #chat input { width: 100%; background: rgba(27, 29, 42, .9); }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(42, 45, 64, .9); padding: 10px 16px; border-radius: 8px; display: none; z-index: 1; }
    #online { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; width: fit-content; max-width: calc(100vw - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(42, 45, 64, .85); padding: 8px 12px; border-radius: 8px; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm">
      <h1>🏨 VLOC Hotel</h1>
      <input id="nome" placeholder="Seu nome" maxlength="16" required autofocus>
      <input id="senha" type="password" placeholder="Senha da sala" required>
      <small style="color:#aab">Quem usar a mesma senha entra na mesma sala.</small>
      <label style="font-size:14px">Cor do avatar <input id="cor" type="color" value="#e94560"></label>
      <button>Entrar</button>
    </form>
  </div>
  <div id="online"></div>
  <div id="status"></div>
  <form id="chat"><input id="msg" placeholder="Digite sua mensagem..." enterkeyhint="send" maxlength="120" autocomplete="off"></form>
  <canvas id="tela"></canvas>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="rede.js"></script>
  <script src="game.js"></script>
</body>
</html>
