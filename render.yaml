# Deploy gratuito no Render: https://render.com/deploy?repo=https://github.com/Vinicius-leon10/VLOC
services:
  - type: web
    name: vloc-hotel
    runtime: node
    plan: free
    rootDir: mini-hotel
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SENHA
        sync: false
